name: Build Native Android APK (GitHub Cloud)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Native Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Build Web Application
        run: |
          npm run lint
          npx vite build
          rm -rf dist/downloads

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/pintarku-release.keystore
          printf 'storeFile=pintarku-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          rm -rf android/app/src/main/assets/public/downloads

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Native Release APK + AAB with Gradle
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize Compiled Files
        run: |
          mkdir -p build-apks
          cp android/app/build/outputs/apk/release/app-release.apk build-apks/DigiLearn-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-apks/DigiLearn-release.aab
          ls -lh build-apks/

      - name: Upload Native APK + AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiLearn-Native-Release
          path: build-apks/*
          retention-days: 30

      - name: Create GitHub Release with APK + AAB (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*
          draft: false
          prerelease: false
          generate_release_notes: true
